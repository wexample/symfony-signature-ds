en:
  field:
    use_personal:
      label: Sign with my signature
    image:
      label: Or an image of my signature
      help: PNG, JPEG or WebP, up to 2 MB. Optional.
    agree:
      label: I have read the documents and I sign them
  action:
    submit: Sign
  error:
    refused:
      not_a_draft: "This envelope is sealed: it no longer changes."
      incomplete: An envelope is sealed with at least one document and one signer.
      not_pending: This envelope no longer waits for signatures.
      already_done: You have signed or declined already.
      not_your_turn: The signers before you have not signed yet.
      tampered: A document changed since the envelope was sealed. Nothing was signed.
      duplicate_signer: This address signs already.

fr:
  field:
    use_personal:
      label: Signer avec ma signature
    image:
      label: Ou une image de ma signature
      help: PNG, JPEG ou WebP, 2 Mo au plus. Facultatif.
    agree:
      label: J'ai lu les documents et je les signe
  action:
    submit: Signer
  error:
    refused:
      not_a_draft: "Cette enveloppe est scellée : elle ne change plus."
      incomplete: Une enveloppe se scelle avec au moins un document et un signataire.
      not_pending: Cette enveloppe n'attend plus de signature.
      already_done: Vous avez déjà signé ou refusé.
      not_your_turn: Les signataires avant vous n'ont pas encore signé.
      tampered: Un document a changé depuis le scellement. Rien n'a été signé.
      duplicate_signer: Cette adresse signe déjà.

zh:
  field:
    use_personal:
      label: 用我的签名签署
    image:
      label: 或我的签名图片
      help: 'PNG、JPEG或WebP，最多2 MB。可选。'
    agree:
      label: 我已阅读文件并签署
  action:
    submit: 签署
  error:
    refused:
      not_a_draft: 此信封已封存：无法再更改。
      incomplete: 信封已封存，至少有一个文件和一个签署人。
      not_pending: 此信封不再等待签名。
      already_done: 您已经签署或拒绝过。
      not_your_turn: 您前面的签署人尚未签署。
      tampered: 自信封封存以来，文件已被更改。没有任何签署。
      duplicate_signer: 此地址已签署。
