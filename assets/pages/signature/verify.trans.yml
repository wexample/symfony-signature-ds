  none: 'Yhtään allekirjoitettua asiakirjaa, jolla on tarkalleen nämä tavut — muutettu tai koskaan allekirjoittamaton.'
  found: 'Allekirjoitettu, muuttumaton, %count% kirjekuoressa.'
  hidden: 'Kirjekuori, johon et kuulu'
  name: 'Allekirjoitettu nimellä'
  sealed: Tiivistetty

ru:
  page_title: 'Проверка файла'
  page_icon: 'ph:bold/seal-check'
  intro: 'Это файл, который был подписан и не изменён? Он хэшируется при получении и ищется по его байтам, независимо от названия; ничего из него не сохраняется.'
  none: 'Нет подписанного документа с точно такими байтами — изменённого или никогда не подписанного.'
  found: 'Подписан, не изменён, в %count% конверте(ах).'
  hidden: 'Конверт, к которому вы не имеете доступа'
  name: 'Подписан как'
  sealed: Запечатан

pl:
  page_title: 'Zweryfikuj plik'
  page_icon: 'ph:bold/seal-check'
  intro: 'Czy ten plik jest podpisany, niezmieniony? Jest haszowany przy przyjęciu i wyszukiwany po swoich bajtach, niezależnie od jego nazwy; nic z niego nie jest przechowywane.'
  none: 'Nie ma podpisanego dokumentu z dokładnie tymi bajtami — zmienionego lub nigdy niepodpisanego.'
  found: 'Podpisany, niezmieniony, w %count% kopertach.'
  hidden: 'Koperta, której nie jesteś częścią'
  name: 'Podpisany jako'
  sealed: 'Zamknięty w'

es:
  page_title: 'Verificar un archivo'
  page_icon: 'ph:bold/seal-check'
  intro: '¿Este archivo es uno que fue firmado y no ha cambiado? Se verifica al llegar y se busca por sus bytes, sin importar su nombre; no se guarda nada de él.'
  none: 'No hay documento firmado que tenga exactamente estos bytes — cambiado o nunca firmado.'
  found: 'Firmado, sin cambios, en %count% sobre(s).'
  hidden: 'Un sobre del que no eres parte'
  name: 'Firmado como'
  sealed: 'Sellado el'

it:
  page_title: 'Verifica un file'
  page_icon: 'ph:bold/seal-check'
  intro: "Questo file è stato firmato, senza modifiche? Viene hashato all'arrivo e cercato per i suoi byte, qualunque sia il suo nome; nulla di esso viene conservato."
  none: 'Nessun documento firmato ha esattamente questi byte — modificato, o mai firmato.'
  found: 'Firmato, immutato, in %count% busta(e).'
  hidden: 'Una busta di cui non fai parte'
  name: 'Firmato come'
