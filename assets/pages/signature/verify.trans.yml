  none: 'Tidak ada dokumen yang ditandatangani memiliki byte ini persis — telah diubah, atau tidak pernah ditandatangani.'
  found: 'Ditandatangani, tidak diubah, dalam %count% amplop.'
  hidden: 'Sebuah amplop yang bukan bagianmu'
