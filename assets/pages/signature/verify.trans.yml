  none: "Bu byte'lara tam olarak sahip imzalı bir belge yok — değiştirilmiş ya da hiç imzalanmamış."
  found: 'İmzalı, değişmemiş, %count% zarf(lar) içinde.'
  hidden: 'Sizin parçası olmadığınız bir zarf'
