vi:
  page_title: 'Xác minh tệp tin'
  page_icon: 'ph:bold/seal-check'
  intro: 'Tệp tin này có phải là tệp đã được ký và không thay đổi? Nó được băm khi đến và được tìm kiếm theo các byte của nó, bất kể tên gọi của nó; không có gì trong đó được giữ lại.'
  none: 'Không có tài liệu nào được ký có đúng các byte này — đã thay đổi hoặc chưa bao giờ được ký.'
