pt_BR:
  page_title: 'Verificar um arquivo'
  page_icon: 'ph:bold/seal-check'
  intro: 'Este arquivo foi assinado e não foi alterado? Ele é hash na chegada e procurado por seus bytes, independentemente do nome; nada dele é mantido.'
