  sealed: 'Disegel pada'

nl:
  page_title: 'Controleer een bestand'
  page_icon: 'ph:bold/seal-check'
  intro: 'Is dit bestand een dat is ondertekend, onveranderd? Het wordt gehasht bij binnenkomst en gezocht op basis van zijn bytes, ongeacht de naam; er wordt niets van bewaard.'
  none: 'Geen ondertekend document heeft precies deze bytes — veranderd, of nooit ondertekend.'
